name: Hermes compatibility

# The bridge against the real Hermes the app ships: whenever the plugin, the patch queue, the pin or the payload
# builder changes, build the pinned, patched Hermes payload and run the compatibility suite (the contracts, the
# gateway start/stop smoke test and the chat controls). The unit tests in CI run without Hermes; this is the half
# that needs it. It takes a while (the payload is about 3 GB), so it runs only when those paths change.
on:
  pull_request:
    paths:
      - "hermes/**"
      - "apps/desktop/python/**"
      - "packaging/payload/**"
      - "packaging/upstream/**"
  push:
    branches: [main]
    paths:
      - "hermes/**"
      - "apps/desktop/python/**"
      - "packaging/payload/**"
      - "packaging/upstream/**"
  workflow_dispatch:

permissions: read-all

concurrency:
  group: hermes-compat-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compat:
    runs-on: windows-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.14"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: Python tools
        run: python -m pip install --disable-pip-version-check -r requirements-dev.txt
      # The builder's download cache (Python, Node, Git, packages), keyed on what decides the payload.
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ runner.temp }}/uv-cache
          key: payload-cache-${{ hashFiles('hermes/pin.json', 'packaging/payload/**') }}
          restore-keys: payload-cache-
      - name: The pinned Hermes with the patch queue
        shell: bash
        run: python packaging/payload/prepare_source.py --dest "$RUNNER_TEMP/hermes-src"
      - name: Build the payload
        shell: bash
        run: python packaging/payload/stage.py --hermes-src "$RUNNER_TEMP/hermes-src" --out "$RUNNER_TEMP/payload" --cache "$RUNNER_TEMP/uv-cache"
      - name: Compatibility suite
        shell: bash
        run: python packaging/upstream/compat.py --payload "$RUNNER_TEMP/payload" --work "$RUNNER_TEMP/compat" --report compat.md
      - name: The suite's report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: compat-report
          path: compat.md
          if-no-files-found: ignore
