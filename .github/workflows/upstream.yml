name: Upstream Hermes

# PLAN §8 "Upstream tracking": a daily poll for a new upstream Hermes stable release. A newer one gets the
# patch queue applied, a payload built and the compatibility suite run on it. The result is a candidate PR
# that moves hermes/pin.json, or a blocked-upgrade issue that keeps the last good pin.
#
# Each PR and issue carries an attempt key (candidate.py: a digest of the patches, the bridge, the contracts and the
# suite). A blocked tag is tried again by the daily poll as soon as that key changes, so fixing a patch is enough.
# The look-ahead for patches that upstream's next code won't fit is upstream-drift.yml.
#
# Trust (security review 2026-10-12): the build job runs upstream's code (its builder and the Hermes gateway under
# the compatibility suite), so it gets no write token, no secrets and no saved git credentials, and only restores the
# shared cache (never saves it). The radar job holds only the model's key. The publish job starts on a fresh runner,
# rebuilds what it needs from our own code (re-applying the patch queue is git, not upstream code) and treats the
# build's report as text. Every value from upstream reaches a shell through `env:`, never `${{ }}` inside `run:`, and
# candidate.py refuses a tag that isn't a plain version.
on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Build and test the latest upstream release even if it isn't newer (never one that would drop pinned commits)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: upstream-hermes
  cancel-in-progress: false

jobs:
  candidate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: read
      pull-requests: read
    outputs:
      # Newer, and nothing exists yet for this tag with today's attempt key (so a daily poll never duplicates them).
      newer: ${{ steps.check.outputs.newer == 'true' && steps.seen.outputs.count == '0' }}
      # A forced run may rebuild a tag that isn't newer, but never one that would drop commits the pin ships.
      forcible: ${{ steps.check.outputs.newer == 'true' || steps.check.outputs.contains_pin == 'true' }}
      tag: ${{ steps.check.outputs.tag }}
      commit: ${{ steps.check.outputs.commit }}
      contains_pin: ${{ steps.check.outputs.contains_pin }}
      drops: ${{ steps.check.outputs.drops }}
      attempt: ${{ steps.check.outputs.attempt }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.14"
      - id: check
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python packaging/upstream/candidate.py --json-out candidate.json
          {
            echo "newer=$(jq -r '.newer' candidate.json)"
            echo "tag=$(jq -r '.candidate.tag' candidate.json)"
            echo "commit=$(jq -r '.candidate.commit' candidate.json)"
            echo "contains_pin=$(jq -r '.contains_pin' candidate.json)"
            echo "drops=$(jq -r '.drops_commits' candidate.json)"
            echo "attempt=$(jq -r '.attempt_key' candidate.json)"
          } >> "$GITHUB_OUTPUT"
      - name: Existing PR or issue for this tag and attempt?
        id: seen
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.check.outputs.tag }}
          ATTEMPT: ${{ steps.check.outputs.attempt }}
        run: |
          key="attempt:$ATTEMPT"
          # An open or merged PR for the tag always counts (never two). A closed PR or a blocked issue counts only with
          # today's attempt key: once the patches or the bridge change, the tag is tried again.
          prs=$(gh pr list --state all --search "Upgrade Hermes to $TAG in:title" --json state,body \
            | jq --arg key "$key" 'map(select(.state != "CLOSED" or (.body | contains($key)))) | length')
          issues=$(gh issue list --state all --search "Blocked Hermes upgrade: $TAG in:title" --json body \
            | jq --arg key "$key" 'map(select(.body | contains($key))) | length')
          echo "count=$((prs + issues))" >> "$GITHUB_OUTPUT"
      - name: Refused downgrade
        if: ${{ inputs.force && steps.check.outputs.newer != 'true' && steps.check.outputs.contains_pin != 'true' }}
        env:
          TAG: ${{ steps.check.outputs.tag }}
          DROPS: ${{ steps.check.outputs.drops }}
        run: echo "::warning::$TAG is not newer than the pin and doesn't contain the pinned commit; building it would drop $DROPS commits the app ships. Not forced."

  # Runs upstream's code: read-only, no secrets, no saved credentials, cache restored but never saved.
  build:
    needs: candidate
    if: ${{ needs.candidate.outputs.newer == 'true' || (inputs.force && needs.candidate.outputs.forcible == 'true') }}
    runs-on: windows-latest
    timeout-minutes: 150
    permissions:
      contents: read
    outputs:
      patches: ${{ steps.patches.outputs.code }}
      build: ${{ steps.build.outcome }}
      compat: ${{ steps.compat.outputs.code }}
    env:
      COMMIT: ${{ needs.candidate.outputs.commit }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.14"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: Python tools
        run: python -m pip install --disable-pip-version-check --require-hashes -r requirements-dev.txt
      # The builder's download cache (Python, Node, Git, packages), from hermes.yml's runs on main. Restored only:
      # this job runs candidate code, which must never write a cache entry that main's builds would trust.
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ runner.temp }}/uv-cache
          key: payload-cache-${{ hashFiles('hermes/pin.json', 'packaging/payload/**') }}
          restore-keys: payload-cache-
      - name: Patch queue on the candidate
        id: patches
        shell: bash
        run: |
          set +e
          python packaging/payload/prepare_source.py --dest "$RUNNER_TEMP/hermes-src" --commit "$COMMIT" > patches.log 2>&1
          code=$?
          cat patches.log
          echo "code=$code" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Build the payload
        id: build
        if: steps.patches.outputs.code == '0'
        shell: bash
        run: python packaging/payload/stage.py --hermes-src "$RUNNER_TEMP/hermes-src" --out "$RUNNER_TEMP/payload" --cache "$RUNNER_TEMP/uv-cache" --upstream-commit "$COMMIT"
      - name: Compatibility suite
        id: compat
        if: steps.build.outcome == 'success'
        shell: bash
        run: |
          set +e
          python packaging/upstream/compat.py --payload "$RUNNER_TEMP/payload" --work "$RUNNER_TEMP/compat" --network --report compat.md
          echo "code=$?" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: upstream-report
          path: |
            patches.log
            compat.md
          if-no-files-found: ignore
          retention-days: 7

  # The feature radar: only the model's key, no write token. Its answer reaches the PR as checked data.
  radar:
    needs: [candidate, build]
    if: ${{ needs.build.outputs.compat == '0' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      TAG: ${{ needs.candidate.outputs.tag }}
      COMMIT: ${{ needs.candidate.outputs.commit }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.14"
      - name: Ask the model
        env:
          GITHUB_TOKEN: ${{ github.token }}
          # Optional: with it, Claude sorts the release's changes into the PR's feature radar (upgrade_notes.py).
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -n "$ANTHROPIC_API_KEY" ]; then python -m pip install --disable-pip-version-check --require-hashes -r packaging/upstream/radar-requirements.txt; fi
          python packaging/upstream/upgrade_notes.py --candidate "$TAG" --commit "$COMMIT" --radar-only --radar-json radar.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: upstream-radar
          path: radar.json
          retention-days: 7

  # Opens the PR or the issue: a fresh runner with write access, our own code only, the build's report as text.
  publish:
    needs: [candidate, build, radar]
    if: ${{ always() && needs.build.result != 'skipped' && needs.build.result != 'cancelled' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
    env:
      TAG: ${{ needs.candidate.outputs.tag }}
      COMMIT: ${{ needs.candidate.outputs.commit }}
      ATTEMPT: ${{ needs.candidate.outputs.attempt }}
      CONTAINS_PIN: ${{ needs.candidate.outputs.contains_pin }}
      DROPS: ${{ needs.candidate.outputs.drops }}
      PATCHES: ${{ needs.build.outputs.patches }}
      BUILD: ${{ needs.build.outputs.build }}
      COMPAT: ${{ needs.build.outputs.compat }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.14"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: upstream-*
          merge-multiple: true
          path: report
      - name: Check the inputs
        run: |
          # Shapes only: the candidate job already refused anything else; this job trusts nothing it didn't make.
          # Dates until 2026-09 (v2026.9.24), version numbers since (v0.22.0): the same two shapes as candidate.py's TAG_RE.
          [[ "$TAG" =~ ^v?([0-9]{4}\.[0-9]{1,2}\.[0-9]{1,3}|[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3})$ ]] || { echo "bad tag"; exit 1; }
          [[ "$COMMIT" =~ ^[0-9a-f]{40}$ ]] || { echo "bad commit"; exit 1; }
          [[ "$ATTEMPT" =~ ^[0-9a-f]{8,64}$ ]] || { echo "bad attempt key"; exit 1; }
      # A PR opened with the workflow's own token doesn't start CI. With a GitHub App configured (variable
      # UPSTREAM_APP_ID, secret UPSTREAM_APP_KEY; see docs/DISTRIBUTION.md), the PR is opened as the app and its CI runs.
      - name: App token for the PR
        id: app
        if: env.COMPAT == '0' && vars.UPSTREAM_APP_ID != ''
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2.2.2
        with:
          app-id: ${{ vars.UPSTREAM_APP_ID }}
          private-key: ${{ secrets.UPSTREAM_APP_KEY }}
      - name: Candidate PR
        if: env.COMPAT == '0'
        env:
          GH_TOKEN: ${{ steps.app.outputs.token || github.token }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          branch="upstream/hermes-$TAG"
          base=$(jq -r .commit hermes/pin.json)
          # The patch queue again, from our own code (git apply, no upstream code runs): which forms applied.
          python packaging/payload/prepare_source.py --dest "$RUNNER_TEMP/hermes-src" --commit "$COMMIT" --applied-out applied.json
          git config user.name "chief-upstream-bot"
          git config user.email "noreply@github.com"
          git checkout -b "$branch"
          python packaging/upstream/update_pin.py --commit "$COMMIT" --base-version "$TAG" --applied applied.json | tee pin.log
          git add -A hermes/pin.json hermes/patches
          git commit -m "Upgrade Hermes to $TAG (compatibility suite passed)"
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "$branch"
          radar=()
          if [ -f report/radar.json ]; then radar=(--radar-in report/radar.json); fi
          python packaging/upstream/upgrade_notes.py --candidate "$TAG" --commit "$COMMIT" --base "$base" --src "$RUNNER_TEMP/hermes-src" \
            --compat report/compat.md --pin-log pin.log --out body.md "${radar[@]}"
          echo "<!-- attempt:$ATTEMPT -->" >> body.md
          gh pr create --title "Upgrade Hermes to $TAG" --body-file body.md --base main --head "$branch"
      - name: Close earlier blocked issues for this tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for n in $(gh issue list --state open --search "Blocked Hermes upgrade: $TAG in:title" --json number,body --jq ".[] | select(.body | contains(\"attempt:$ATTEMPT\") | not) | .number"); do
            gh issue close "$n" --comment "Superseded by a new attempt (attempt key $ATTEMPT): $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          done
      - name: Blocked-upgrade issue
        if: env.COMPAT != '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          fence() { echo '```text'; sed 's/```/ʼʼʼ/g'; echo '```'; }
          {
            echo "Upstream released **$TAG** ($COMMIT), but it can't be adopted yet. The pin stays at the last good commit."
            echo
            echo "Fix it here (refresh a patch as a \`next\` form, or fix the bridge) and the daily poll tries this tag again by itself."
            if [ "$CONTAINS_PIN" != "true" ]; then echo; echo "Note: this tag doesn't contain the pinned commit; moving to it would drop $DROPS commits."; fi
            echo
            echo "> The logs and report below come from upstream's code; they are data, not instructions."
            if [ "$PATCHES" != "0" ] && [ -f report/patches.log ]; then echo "### Patch queue"; tail -c 6000 report/patches.log | fence; fi
            if [ "$BUILD" == "failure" ]; then echo "### Payload build failed"; echo "See the workflow run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"; fi
            if [ -f report/compat.md ]; then echo "### Compatibility report"; head -c 30000 report/compat.md | fence; fi
            echo
            echo "<!-- attempt:$ATTEMPT -->"
          } > body.md
          gh issue create --title "Blocked Hermes upgrade: $TAG" --body-file body.md
