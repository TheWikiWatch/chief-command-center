name: Upstream Hermes

# PLAN §8 "Upstream tracking": a daily poll for a new upstream Hermes stable release. A newer one gets the
# patch queue applied, a payload built and the compatibility suite run on it. The result is a candidate PR
# that moves hermes/pin.json, or a blocked-upgrade issue that keeps the last good pin.
on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Build and test the latest upstream release even if it isn't newer"
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: upstream-hermes
  cancel-in-progress: false

jobs:
  candidate:
    runs-on: ubuntu-latest
    outputs:
      # Newer, and no PR or issue exists for that tag yet (so a daily poll never duplicates them).
      newer: ${{ steps.check.outputs.newer == 'true' && steps.seen.outputs.count == '0' }}
      tag: ${{ steps.check.outputs.tag }}
      commit: ${{ steps.check.outputs.commit }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.14"
      - id: check
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python packaging/upstream/candidate.py --json-out candidate.json
          echo "newer=$(jq -r '.newer' candidate.json)" >> "$GITHUB_OUTPUT"
          echo "tag=$(jq -r '.candidate.tag' candidate.json)" >> "$GITHUB_OUTPUT"
          echo "commit=$(jq -r '.candidate.commit' candidate.json)" >> "$GITHUB_OUTPUT"
      - name: Existing PR or issue for this tag?
        id: seen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag='${{ steps.check.outputs.tag }}'
          n=$( (gh pr list --state all --search "Upgrade Hermes to $tag in:title" --json number; gh issue list --state all --search "Blocked Hermes upgrade: $tag in:title" --json number) | jq -s 'map(length) | add')
          echo "count=$n" >> "$GITHUB_OUTPUT"

  upgrade:
    needs: candidate
    if: ${{ needs.candidate.outputs.newer == 'true' || inputs.force }}
    runs-on: windows-latest
    timeout-minutes: 150
    env:
      TAG: ${{ needs.candidate.outputs.tag }}
      COMMIT: ${{ needs.candidate.outputs.commit }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.14"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: Patch queue on the candidate
        id: patches
        shell: bash
        run: |
          set +e
          python packaging/payload/prepare_source.py --dest "$RUNNER_TEMP/hermes-src" --commit "$COMMIT" > patches.log 2>&1
          code=$?
          cat patches.log
          echo "code=$code" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Build the payload
        id: build
        if: steps.patches.outputs.code == '0'
        shell: bash
        run: |
          python -m pip install --disable-pip-version-check pyyaml cryptography requests
          python packaging/payload/stage.py --hermes-src "$RUNNER_TEMP/hermes-src" --out "$RUNNER_TEMP/payload" --cache "$RUNNER_TEMP/uv-cache"
      - name: Compatibility suite
        id: compat
        if: steps.build.outcome == 'success'
        shell: bash
        run: |
          set +e
          python packaging/upstream/compat.py --payload "$RUNNER_TEMP/payload" --work "$RUNNER_TEMP/compat" --network --report compat.md
          echo "code=$?" >> "$GITHUB_OUTPUT"
          exit 0
      # A PR opened with the workflow's own token doesn't start CI. With a GitHub App configured (variable
      # UPSTREAM_APP_ID, secret UPSTREAM_APP_KEY; see docs/DISTRIBUTION.md), the PR is opened as the app and its CI runs.
      - name: App token for the PR
        id: app
        if: steps.compat.outputs.code == '0' && vars.UPSTREAM_APP_ID != ''
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2.2.2
        with:
          app-id: ${{ vars.UPSTREAM_APP_ID }}
          private-key: ${{ secrets.UPSTREAM_APP_KEY }}
      - name: Candidate PR
        if: steps.compat.outputs.code == '0'
        shell: bash
        env:
          GH_TOKEN: ${{ steps.app.outputs.token || github.token }}
        run: |
          branch="upstream/hermes-$TAG"
          git config user.name "chief-upstream-bot"
          git config user.email "noreply@github.com"
          git checkout -b "$branch"
          python packaging/upstream/update_pin.py --commit "$COMMIT" --base-version "$TAG"
          git add hermes/pin.json
          git commit -m "Upgrade Hermes to $TAG (compatibility suite passed)"
          git push -u origin "$branch"
          { echo "Upstream released **$TAG** ($COMMIT). The patch queue applied and the compatibility suite passed on a freshly built payload."; echo; cat compat.md; echo; echo "Ship it through a normal app release (the updater), not by editing installs."; } > body.md
          gh pr create --title "Upgrade Hermes to $TAG" --body-file body.md --base main --head "$branch"
      - name: Blocked-upgrade issue
        if: always() && steps.compat.outputs.code != '0'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "Upstream released **$TAG** ($COMMIT), but it can't be adopted yet. The pin stays at the last good commit."
            echo
            if [ "${{ steps.patches.outputs.code }}" != "0" ]; then echo "### Patch queue"; echo '```'; tail -c 6000 patches.log; echo '```'; fi
            if [ "${{ steps.build.outcome }}" == "failure" ]; then echo "### Payload build failed"; echo "See the workflow run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"; fi
            if [ -f compat.md ]; then cat compat.md; fi
          } > body.md
          gh issue create --title "Blocked Hermes upgrade: $TAG" --body-file body.md
