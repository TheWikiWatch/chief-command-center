name: CI

on:
  push:
    branches: [main]
  pull_request:

# Read-only by default; no job here writes to the repository.
permissions: read-all

jobs:
  check:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      # Actions are pinned to a commit (the tag in the comment); Renovate proposes updates.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            apps/web/package-lock.json
            apps/desktop/package-lock.json
      # The payload's Python, so the bridge's tests run on the version it ships with.
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.14"
      - name: Python tools (pinned)
        run: python -m pip install --disable-pip-version-check -r requirements-dev.txt
      - name: Privacy scan (files, and the commits this push or pull request adds)
        env:
          PRIVACY_DENYLIST: ${{ secrets.PRIVACY_DENYLIST }}
          RANGE: ${{ github.event_name == 'pull_request' && format('{0}..{1}', github.event.pull_request.base.sha, github.event.pull_request.head.sha) || format('{0}..{1}', github.event.before, github.sha) }}
        shell: bash
        run: node scripts/privacy-scan.mjs --history --range "$RANGE"
      - name: Web dependencies
        run: npm --prefix apps/web ci
      - name: Web typecheck, lint and tests
        run: npm --prefix apps/web run check
      - name: Desktop shell typecheck and tests
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
        run: |
          npm --prefix apps/desktop ci
          npm --prefix apps/desktop run check
      - name: Python lint and types (Ruff, pyright)
        run: |
          npm ci
          npm run lint:python
      - name: Python tests
        run: python -B -m unittest discover -s hermes/tests
      - name: Backup engine tests
        run: python -B -m unittest discover -s backup/tests

  # Known vulnerabilities in the dependencies (OSV database), and npm's own audit of what ships, as a warning.
  dependencies:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: OSV-Scanner
        uses: google/osv-scanner-action/osv-scanner-action@a345acffa64b0eaede81a3d9aae6141214d9c8fc # v2.6.0
        with:
          scan-args: |-
            --lockfile=package-lock.json
            --lockfile=apps/web/package-lock.json
            --lockfile=apps/desktop/package-lock.json
            --lockfile=requirements.txt:requirements-dev.txt
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: Licences of what ships (npm; the release also checks the payload's Python packages)
        run: node scripts/licenses.mjs --check
      - name: npm audit of what ships (warning only)
        continue-on-error: true
        run: |
          npm --prefix apps/web audit --omit=dev
          npm --prefix apps/desktop audit --omit=dev
