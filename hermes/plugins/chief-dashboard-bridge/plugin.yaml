manifest_version: 2
api_version: 1
name: chief-dashboard-bridge
version: 0.1.16
description: Loopback bridge for Chief Command Center (Command Center chat platform, roster, kanban status, voice, approvals, phone alerts) and the fleet tools the chief uses to manage its bots. Versioned with the app.
provides_hooks: []
author: Chief Command Center contributors
license: MIT
tags: [dashboard, bridge, loopback]
config_schema:
  port: {type: int, default: 7790, description: "Loopback port (127.0.0.1 only)"}
  token: {type: str, default: "", description: "Bearer token; empty reads CHIEF_DASHBOARD_TOKEN, then a plugin .token file"}
  session_key: {type: str, default: "", description: "Override session_key (Command Center preferred; Discord fallback if CC disabled)"}

